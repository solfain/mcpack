name: build-mod

# Builds the mcpack-sky Fabric mod and publishes the jar into dist/mod/.
# Runs on GitHub's runners because the agent sandbox cannot reach the Maven /
# Mojang hosts that a Minecraft mod build needs.
on:
  push:
    paths:
      - 'mod/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build
        working-directory: mod
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar artefact
        uses: actions/upload-artifact@v4
        with:
          name: mcpack-sky-jar
          path: mod/build/libs/*.jar
          if-no-files-found: error

      - name: Publish jar into the repo
        if: github.event_name == 'push'
        run: |
          set -e
          mkdir -p dist/mod
          cp mod/build/libs/*[0-9].jar dist/mod/ 2>/dev/null || cp mod/build/libs/*.jar dist/mod/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain dist/mod)" ]; then
            git add dist/mod
            git commit -m "build: publish mcpack-sky jar [skip ci]"
            git push
          else
            echo "jar unchanged - nothing to publish"
          fi
